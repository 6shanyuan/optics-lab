  <path d="M351 54q-30 58 0 116m17-116q30 58 0 116" fill="rgba(105,143,127,.12)" stroke="#6c8c7b" stroke-width="2"/>
  <rect x="328" y="62" width="63" height="10" rx="3" fill="#5a7769"/><text x="360" y="42" text-anchor="middle" font-family="monospace" font-size="9" fill="#94998f">光阑 / 入瞳</text>
  <text x="360" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#53665a">成像光路</text>
  <rect x="493" y="72" width="14" height="80" rx="3" fill="#dce6e6" stroke="#638493" stroke-width="1.5"/><path d="M500 80v65" stroke="#4d82a4" stroke-dasharray="2 4"/>
  <text x="500" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#53665a">探测器</text>
