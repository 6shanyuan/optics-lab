<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">标记成像传感器测量链路示意图</title>
  <desc id="desc">照明、标记、成像光路与光阑、探测器、估计算法。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0v6l7-3z" fill="#637c71"/></marker></defs>
  <rect width="760" height="230" fill="#f7f6f0"/>
  <path d="M95 112H663" stroke="#81998a" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <rect x="34" y="78" width="76" height="68" rx="12" fill="#f4e7dc" stroke="#d3a284"/><circle cx="72" cy="112" r="13" fill="#d6754d" opacity=".8"/>
  <text x="72" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#53665a">照明</text>
  <rect x="174" y="83" width="82" height="58" rx="8" fill="#fdfbf6" stroke="#bdc9bd"/><path d="m188 126 13-30 13 30 13-30 14 30" fill="none" stroke="#ca6845" stroke-width="2"/>
