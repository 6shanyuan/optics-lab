  <rect width="760" height="230" fill="#f7f6f0"/>
  <path d="M112 108H648" stroke="#81998a" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <rect x="45" y="75" width="93" height="67" rx="10" fill="#fdfbf6" stroke="#bdc9bd"/><path d="m62 120 10-26 10 26 10-26 11 26 14-26" fill="none" stroke="#ca6845" stroke-width="2"/>
  <text x="91" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#53665a">物 / 掩模端</text>
  <path d="M248 50q-29 58 0 116m19-116q29 58 0 116m15-116q29 58 0 116m19-116q29 58 0 116" fill="rgba(105,143,127,.12)" stroke="#6c8c7b" stroke-width="2.3"/>
